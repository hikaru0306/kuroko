# =====================================================================
# 読み合い（相手モデリング / yomiai）— ここを編集すると相手想定が変わる
# =====================================================================

# 相手アーキタイプの事前分布（試合中の観測でこの土台を更新していく）
archetype_prior:
  aggro: 0.34      # 速攻・前のめり
  control: 0.33    # 妨害・長期戦
  combo: 0.33      # コンボ始動型

# アグロ相手を想定して、自アクティブに残しておきたいHPバッファ
hp_buffer_vs_aggro: 30

# ベンチがこの枚数以下の相手はアグロ寄りと判断する
low_bench_threshold: 1
