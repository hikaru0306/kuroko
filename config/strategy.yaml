# =====================================================================
# 理想のムーブ（ゲームプラン）— ここを編集すると「やりたい順番」が変わる
# =====================================================================
# 値は kuroko_ai/config.py の DEFAULTS を上書きする（書いた項目だけ反映）。

# --- 行動メニューの戦略モード -----------------------------------------
# engine_order : エンジンが並べた選択肢の順(展開→攻撃→終了)を信頼し先頭を選ぶ。
#                ローカル自己対戦で最も強い。【推奨デフォルト】
# priority     : 下の action_priority + evaluation.yaml で完全に並べ替える(実験用)。
#                カードDB(deck.yaml)を正しく整備すると伸ばせる余地がある。
action_menu_mode: engine_order

# KO上書き: 確実に倒せるワザを最優先する。正確なカードDB(HP/ワザ打点)が前提。
# 仮データのままだと誤KO判定で早すぎる攻撃をして逆効果なので、まずは false 推奨。
enable_ko_override: false

# エネルギーを付ける先の加点（deck.yaml のHP/役割を整備してから有効化推奨）
attach_bonus:
  main_attacker: 0.0   # メインアタッカーへ付ける加点
  active: 0.0          # アクティブへ付ける加点

# 場づくりで最低限ベンチに並べたい「たねポケモン」の数
desired_bench_pokemon: 3

# メインアタッカーに乗せたいエネルギー枚数（攻撃を始める目安）
attacker_energy_goal: 2

# --- action_menu_mode: priority の時だけ使う基本優先度 -----------------
# 高いほど先に実行。最終的な価値は evaluation.yaml の重み＋盤面状況で上下する。
action_priority:
  ability: 90          # 特性（基本ノーリスク → 先に使う）
  draw_supporter: 85   # ドロー/サーチ系サポート
  evolve: 84           # 進化（アタッカー育成 → 攻撃より先）
  put_basic: 78        # たねポケモンをベンチへ展開
  play_item: 60        # グッズ
  attach_energy: 80    # エネ付け（攻撃より先に行う）
  attack: 45           # ワザ（KO可能なら status 補正で大きく加点される）
  retreat: 20          # にげる（基本は消極的）
  end_turn: 0          # 何も無ければターン終了

# この評価値未満の行動はやらずに終了する（マージナルな無駄手の抑制に使用）
min_action_value: 1.0

# はい/いいえ（マリガン等）の既定。true = 最初の選択肢(=はい寄り)を選ぶ
default_yes: true
