# =====================================================================
# 盤面評価の重み — ここを編集すると「何を価値とみなすか」が変わる
# =====================================================================
# 大きいほどその要素を重視。サイド/KOが最重要になるよう設定している。

weights:
  prize_taken: 100.0          # 自分が取ったサイド差（最重要）
  ko_opponent: 120.0          # 相手アクティブをKOできる行動への加点
  knocked_out_self: -110.0    # 自分が倒される見込みへの減点
  damage_dealt: 0.6           # 与ダメージ1あたりの価値
  bench_pokemon: 8.0          # 自分のベンチたね数
  energy_on_attacker: 6.0     # メインアタッカーのエネ枚数
  hand_size: 1.5              # 手札枚数（リソース）
  active_hp_remaining: 0.2    # 自アクティブの残HP
  unknown_attack_value: 30.0  # 打点不明(DB未登録)のワザの暫定価値。攻撃を選ばせる土台

# カードDBにHP未登録のポケモンを評価する際のフォールバックHP
default_pokemon_hp: 120
