# =====================================================================
# 盤面評価の重み — ここを編集すると「何を価値とみなすか」が変わる
# =====================================================================
# 大きいほどその要素を重視。サイド/KOが最重要になるよう設定している。

weights:
  prize_taken: 100.0          # 自分が取ったサイド差（最重要）
  ko_opponent: 120.0          # 相手アクティブをKOできる行動への加点
  knocked_out_self: -110.0    # 自分が倒される見込みへの減点
  damage_dealt: 0.6           # 与ダメージ1あたりの価値
  bench_pokemon: 8.0          # 自分のベンチたね数
  energy_on_attacker: 6.0     # メインアタッカーのエネ枚数
  hand_size: 1.5              # 手札枚数（リソース）
  active_hp_remaining: 0.2    # 自アクティブの残HP
  unknown_attack_value: 30.0  # 打点不明(DB未登録)のワザの暫定価値。攻撃を選ばせる土台

# カードDBにHP未登録のポケモンを評価する際のフォールバックHP
default_pokemon_hp: 120

# --- ワザ選択の効率スコア重み -----------------------------------------
# 「最大打点」一辺倒にせず、副作用込みで一番効率の良いワザを選ぶための係数。
# deck.yaml の各ワザに self_damage / discards_energy / cant_attack_next /
# bench_damage / attaches_energy などを書くと、ここの係数で加減点される。
attack:
  ko_value: 1000.0        # 相手アクティブをKOできる価値（最重要）
  overkill: 0.05          # KO時、打点が大きいほど僅かに減点（オーバーキル回避＝温存）
  damage: 1.0             # KO不可時の与ダメージ1あたり
  bench_damage: 1.2       # 相手ベンチ1体への打点1あたり（将来のサイドにつながる）
  energy_accel: 40.0      # 攻撃しながらエネ加速1枚あたり（高く評価）
  heal: 0.3               # 自分の回復1あたり
  recoil: 1.5             # 反動（自傷）ダメージ1あたりのペナルティ
  energy_discard: 25.0    # 自分のエネを捨てる1枚あたりのペナルティ（次の攻撃が遅れる）
  cant_attack_next: 150.0 # 次ターン攻撃できないワザのペナルティ（テンポ損）
  unknown: 30.0           # 打点不明（DB未登録）ワザの暫定スコア
