# =====================================================================
# デッキ定義 + カード知識ベース
# =====================================================================
# observation には「カードid」しか来ないため、各idの意味はここで定義する。
#
# ★ 下の値の多くは tools/mine_cards.py が cabt 自己対戦ログから抽出した
#   「実測の下書き」です（ワザid・打点・HP・カテゴリ）。名前と一部の分類は
#   公式の「指定カードリスト」で必ず検証・補正してください。
#   再生成: .venv/bin/python tools/mine_cards.py --games 100 --out config/deck.auto.yaml
#
# deck: を書くと deck.csv より優先。ここでは deck.csv を真実の源にするため省略。

cards:
  # --- エネルギー（実測: エネとして場に付けられている） ---
  3:
    name: "基本エネルギー(仮)"
    category: basic_energy

  1163:
    name: "エネルギー(仮)"          # 特殊エネの可能性あり → 要確認
    category: basic_energy

  # --- アタッカー進化ライン 721 → 722 → 723（実測） ---
  721:
    name: "card721(仮)"
    category: pokemon
    stage: 0                       # たね（推定）
    hp: 170                        # 実測推定・要確認
    role: starter
    attacks:
      - {id: 1042, damage: 20}     # 実測: 観測打点の最頻値
      - {id: 1043, damage: 130}

  722:
    name: "card722(仮)"
    category: pokemon
    stage: 1                       # 1進化（推定）
    hp: 100                        # 実測推定・要確認（721より低く出ており要検証）
    evolves_from: 721              # 推定
    attacks:
      - {id: 1044, damage: 10}
      - {id: 1045, damage: 30}

  723:
    name: "card723(仮)"
    category: pokemon
    stage: 2                       # 2進化（実測で evolves を確認）
    hp: 400                        # 実測推定・要確認
    evolves_from: 722              # 実測推定
    role: main_attacker            # 最大打点のアタッカー
    # ワザの副作用を書くと「最大打点」ではなく効率で選ぶようになる。
    # 使えるフィールド（任意・既定0/false）:
    #   damage, cost, self_damage(反動), discards_energy(エネ捨て),
    #   cant_attack_next(次ターン攻撃不可), bench_damage & bench_targets(ベンチ攻撃),
    #   attaches_energy(攻撃しながらエネ加速), heal(回復)
    # 例: 高打点だが反動とエネ捨てがある主力ワザ →
    #   - {id: 1046, damage: 300, self_damage: 30, discards_energy: 2}
    # 現状は公式効果が未確認のため打点のみ（要・公式カードリストで補完）。
    attacks:
      - {id: 1046, damage: 300}    # 主力ワザ（効果は要確認）
      - {id: 1047, damage: 200}

  # --- トレーナーズ or 控えポケモン（実測では判別不能 → 要・公式リスト確認） ---
  # mine_cards.py ではワザ/エネ受け/進化のいずれも観測されず。多くはサポート/グッズと推測。
  1092: {name: "card1092(仮・要確認)", category: item}
  1121: {name: "card1121(仮・要確認)", category: item}
  1145: {name: "card1145(仮・要確認)", category: item}
  1219: {name: "card1219(仮・要確認)", category: item}
  1227: {name: "card1227(仮・要確認)", category: item}
  1262: {name: "card1262(仮・要確認)", category: item}
